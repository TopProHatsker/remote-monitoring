name: Container and application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python checks
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          ruff check app tests
          python -m pytest -q
      - name: Build image
        run: docker build -t pc-monitor:test .
      - name: Validate and start Compose
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml up -d
          curl --retry 45 --retry-all-errors --retry-delay 2 -fsS http://localhost:8080/health
      - name: Container smoke and dependency recovery
        run: python tests/smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser scenarios
        working-directory: frontend
        run: npm test -- --reporter=github
      - name: Logs
        if: failure()
        run: docker compose -f compose.yaml logs --tail=150
      - name: Stop this test stack
        if: always()
        run: docker compose -f compose.yaml down

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "PC Monitor $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
